# Parameters for the rb3_control flight_controller node.
# ros2 run rb3_control flight_controller --ros-args --params-file control.yaml
/drone/flight_controller:
  ros__parameters:
    port: /dev/ttyACM0          # Betaflight USB CDC; check with: ls /dev/serial/by-id/
    baud: 115200                # ignored by USB CDC, kept for UART fallback (/dev/ttyHS2)

    rc_rate_hz: 50.0            # stick stream rate; Betaflight drops to the radio below ~10 Hz
    telemetry_rate_hz: 20.0     # MSP polling + control loop rate
    command_timeout: 0.5        # stop sending if no command arrives within this many seconds
    odom_timeout: 0.5           # cmd_vel is ignored if odom feedback is older than this

    require_armed: true         # never send sticks unless the radio armed the drone
    require_override: true      # never send sticks unless the MSP OVERRIDE switch is on

    max_tilt_deg: 15.0          # roll/pitch command that maps to full stick deflection
    max_yaw_rate_deg: 120.0
    throttle_min: 1000
    throttle_max: 2000
    hover_throttle: 0.55        # cmd_vel controller baseline; measure it in a manual hover
